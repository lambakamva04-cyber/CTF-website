# Cloudflare Tunnel configuration.
#
# Generated by setup-tunnel.sh from cloudflared/config.template.yml in the n8n
# stack, and installed here at /etc/cloudflared/config.yml. Editing this copy is
# fine; re-running setup-tunnel.sh overwrites it, so put changes you want to
# keep into the template as well.
#
# After editing:
#   sudo cloudflared --config /etc/cloudflared/config.yml tunnel ingress validate
#   sudo systemctl restart cloudflared

tunnel: __TUNNEL_ID__
credentials-file: __CREDENTIALS_FILE__

# The tunnel dials out to Cloudflare's edge over QUIC (UDP/7844) and falls back
# to HTTP/2 (TCP/7844) on its own. Some budget VPS providers filter outbound
# UDP, which shows up as a tunnel that connects, drops, and reconnects every
# few seconds. If you see that, set this to http2.
protocol: __PROTOCOL__

# Updates come from apt, not from the binary rewriting itself at 3am.
no-autoupdate: true

loglevel: info

# Prometheus metrics and a readiness endpoint, on loopback only.
#   curl http://127.0.0.1:20241/ready
metrics: 127.0.0.1:20241

# Rules are evaluated top to bottom; the first match wins, so the catch-all
# must stay last.
ingress:
  - hostname: __HOSTNAME__
    service: __SERVICE_URL__
    originRequest:
      # n8n on a small box can be slow to accept the first connection after a
      # restart; 30s is forgiving without hanging forever on a dead origin.
      connectTimeout: 30s
      # Reuse connections to the origin — the editor UI is chatty.
      keepAliveTimeout: 90s
      keepAliveConnections: 10
      # The origin is plain HTTP on loopback, so there is no certificate to
      # verify and nothing to skip. Stated explicitly so nobody "fixes" a
      # future TLS error by disabling verification here.
      noTLSVerify: false

  # Anything arriving on this tunnel for a hostname you didn't configure gets a
  # flat 404. Without this rule cloudflared refuses to start.
  - service: http_status:404
