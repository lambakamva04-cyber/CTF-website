name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  control-platform:
    name: Control platform (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Wrangler 4 requires Node 22 or newer.
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Typecheck (client and worker)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check migrations apply from scratch
        run: npx wrangler d1 migrations apply ctf-app --local
        env:
          WRANGLER_SEND_METRICS: 'false'
          CLOUDFLARE_API_TOKEN: ''
