name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  control-platform:
    name: Control platform (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Wrangler 4 requires Node 22 or newer.
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Typecheck (client and worker)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check migrations apply from scratch
        run: npx wrangler d1 migrations apply ctf-app --local
        env:
          WRANGLER_SEND_METRICS: 'false'
          CLOUDFLARE_API_TOKEN: ''

  demo-pages:
    name: Demo pages (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No secrets here on purpose: every environment variable is read per
      # request, so a build that needs Supabase credentials would be a bug.
      - name: Build (Next)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # The deployable artefact. A green `next build` says nothing about
      # whether the OpenNext adapter can still turn it into a Worker, and that
      # is the thing that actually ships.
      - name: Build (Cloudflare Worker)
        run: npm run build:worker
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  demo-heartbeat:
    name: Demo heartbeat (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/heartbeat

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/heartbeat/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck
