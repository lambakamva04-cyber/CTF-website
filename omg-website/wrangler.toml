# Worker for the OMG – Oh! My Glam site: the static pages in ./public, the
# booking calendar and reviews API under /api/, and the admin page at /admin/.
#
# Deploy from this folder with `npm run deploy` (or `npm run deploy:omg` from
# the repo root). One-time setup is in README.md.
#
# The site lives at https://ohmyglam.online, a Custom Domain attached in the
# Cloudflare dashboard (Workers & Pages > omg-oh-my-glam > Domains), not here:
# with no `routes` in this file, a deploy never touches it. www.ohmyglam.online
# forwards to it (src/index.js).
name = "omg-oh-my-glam"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Off: the account's *.workers.dev address (it carries the CTF name) and the
# preview URLs on it. Only ohmyglam.online serves the site.
workers_dev = false
preview_urls = false

# Every request runs through the Worker first, pages and images included, so
# every response carries the security headers set in src/security.js.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
# Unknown addresses get public/404.html with a 404 status.
not_found_handling = "404-page"

# Bookings, reviews, admin sessions and rate-limit counters.
# `npm run setup` creates it and writes its id here; commit that change.
# Until then the placeholder below stops `npm run deploy` with a clear message.
# Photos OMG uploads on the admin page's Website tab, served at /media/.
# (R2 would need a payment card on the Cloudflare account; KV does not.)
[[kv_namespaces]]
binding = "MEDIA"
id = "47faf88d90d14769a41d9e993cbd99d0"

[[d1_databases]]
binding = "DB"
database_name = "omg-oh-my-glam"
database_id = "2b9f3a76-bdfc-49d9-8164-fe0683ef64f0"
migrations_dir = "migrations"

# Every 15 minutes: read OMG's own calendar for busy times (if she linked one).
# The 01:00 UTC run also does the daily clean-up of old personal data, expired
# sessions and rate-limit counters. One schedule: the free plan allows five per
# account, and the account's other Workers use four.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

# Secrets, set with `npx wrangler secret put <NAME>`, never in this file:
#   ADMIN_PASSWORD   optional: the admin password until one is set on the admin
#                    page with a setup code (`npm run admin:setup-code`)
